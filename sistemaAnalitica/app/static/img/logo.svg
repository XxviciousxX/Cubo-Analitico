<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005cab" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a838" />
      <stop offset="100%" stop-color="#005a1a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005cab" />
      <stop offset="100%" stop-color="#002855" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#004482" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#004482" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo redondeado suave con borde -->
  <rect width="512" height="512" rx="100" fill="#ffffff" filter="url(#glow)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#e2e8f0" stroke-width="4"/>

  <!-- Grupo Isométrico de Cubo OLAP -->
  <g transform="translate(256, 256)">
    <!-- Cubo Central Superior (Dimensión Métrica) -->
    <g transform="translate(0, -90)">
      <!-- Top Face -->
      <polygon points="0,-45 78,0 0,45 -78,0" fill="url(#topFace)"/>
      <!-- Left Face -->
      <polygon points="-78,0 0,45 0,135 -78,90" fill="url(#leftFace)"/>
      <!-- Right Face -->
      <polygon points="0,45 78,0 78,90 0,135" fill="url(#rightFace)"/>
    </g>

    <!-- Cubo Inferior Izquierdo (Dimensión Categórica) -->
    <g transform="translate(-82, 50)">
      <!-- Top Face -->
      <polygon points="0,-45 78,0 0,45 -78,0" fill="#60a5fa"/>
      <!-- Left Face -->
      <polygon points="-78,0 0,45 0,135 -78,90" fill="#1d4ed8"/>
      <!-- Right Face -->
      <polygon points="0,45 78,0 78,90 0,135" fill="#2563eb"/>
    </g>

    <!-- Cubo Inferior Derecho (Métricas Esmeralda) -->
    <g transform="translate(82, 50)">
      <!-- Top Face -->
      <polygon points="0,-45 78,0 0,45 -78,0" fill="#4ade80"/>
      <!-- Left Face -->
      <polygon points="-78,0 0,45 0,135 -78,90" fill="#15803d"/>
      <!-- Right Face -->
      <polygon points="0,45 78,0 78,90 0,135" fill="#16a34a"/>
    </g>

    <!-- Nodos de Red y Analítica (Líneas de conexión y puntos de datos) -->
    <circle cx="0" cy="-90" r="12" fill="#ffffff" stroke="#004482" stroke-width="5"/>
    <circle cx="-82" cy="50" r="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="5"/>
    <circle cx="82" cy="50" r="12" fill="#ffffff" stroke="#15803d" stroke-width="5"/>
    <circle cx="0" cy="0" r="15" fill="#005cab" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
