<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Error {{ codigo_estado }} | Sistema Analítico</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hanken+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#004482",
                        "primary-container": "#005cab",
                        "on-primary": "#ffffff",
                        "secondary": "#006e20",
                        "background": "#f9f9fc",
                        "surface": "#ffffff",
                        "surface-container-low": "#f3f3f6",
                        "on-surface": "#1a1c1e",
                        "on-surface-variant": "#414751",
                        "outline": "#727783",
                        "outline-variant": "#c1c6d3",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a"
                    },
                    fontFamily: {
                        body: ["Inter", "sans-serif"],
                        display: ["Hanken Grotesk", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 35px 0 rgba(0, 68, 130, 0.10);
        }
        .mesh-gradient {
            background-color: #f9f9fc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(186, 26, 26, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(0, 68, 130, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 68, 130, 0.06) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(186, 26, 26, 0.05) 0px, transparent 50%);
        }
        .btn-glow {
            background: linear-gradient(135deg, #004482 0%, #005cab 100%);
            box-shadow: 0 4px 15px rgba(0, 68, 130, 0.25);
            transition: all 0.25s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 6px 20px rgba(0, 68, 130, 0.35);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="mesh-gradient font-body text-on-surface min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-lg">
        <div class="glass-card rounded-2xl overflow-hidden p-8 text-center">
            <!-- Icono y Código -->
            <div class="w-16 h-16 rounded-2xl bg-error-container text-error flex items-center justify-center mx-auto mb-4 shadow-xs">
                <span class="material-symbols-outlined text-4xl">warning</span>
            </div>

            <span class="inline-block px-3 py-1 rounded-full text-xs font-mono font-bold bg-error/10 text-error mb-2">
                Código de Estado HTTP: {{ codigo_estado }}
            </span>

            <h1 class="font-display text-2xl md:text-3xl font-black text-on-surface tracking-tight mt-1">
                {{ titulo_error }}
            </h1>

            <p class="text-sm text-on-surface-variant mt-2 leading-relaxed">
                {{ mensaje_error }}
            </p>

            {% if detalle_tecnico %}
            <div class="mt-4 p-3 rounded-xl bg-surface-container-low text-left border border-outline-variant/60 text-xs overflow-x-auto">
                <p class="font-bold text-on-surface-variant uppercase text-[10px] mb-1">Detalle Técnico de la Excepción:</p>
                <code class="text-error font-mono text-[11px] block whitespace-pre-wrap">{{ detalle_tecnico }}</code>
            </div>
            {% endif %}

            <div class="mt-6 flex justify-center gap-3">
                <a href="/" class="btn-glow text-on-primary font-bold px-6 py-2.5 rounded-xl text-xs flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">home</span>
                    Volver al Inicio Seguro
                </a>
                <a href="/login" class="bg-surface-container text-on-surface font-bold px-5 py-2.5 rounded-xl text-xs flex items-center gap-1.5 border border-outline-variant hover:bg-surface-container-high">
                    <span class="material-symbols-outlined text-sm">login</span>
                    Iniciar Sesión
                </a>
            </div>
        </div>
    </div>

</body>
</html>
